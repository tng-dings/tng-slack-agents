# Hardened same-host edge for Slack Events API and Discord interactions ingress.
# Replace the server name and certificate paths before validating with nginx -t.
worker_processes auto;
error_log logs/slack-edge-error.log crit;
pid logs/slack-edge.pid;

events {
    worker_connections 256;
}

http {
    default_type application/octet-stream;
    server_tokens off;

    # Deliberately excludes query strings, headers, and bodies.
    log_format privacy '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    # Request access logging is off so attacker-generated rejects cannot amplify logs.
    # The privacy format is available only for an approved, time-bounded diagnostic.
    access_log off;

    client_max_body_size 256k;
    client_body_buffer_size 256k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    send_timeout 5s;
    keepalive_timeout 5s;
    keepalive_requests 100;
    reset_timedout_connection on;

    limit_conn_zone $binary_remote_addr zone=per_ip_connections:1m;
    limit_conn_zone $server_name zone=global_connections:1m;
    limit_req_zone $binary_remote_addr zone=per_ip_requests:1m rate=5r/s;
    limit_req_zone $server_name zone=global_requests:1m rate=20r/s;
    limit_req_status 429;
    limit_conn_status 429;

    upstream slack_bolt_private {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    upstream discord_interactions_private {
        server 127.0.0.1:3001;
        keepalive 16;
    }

    # Supports Slack Events API, Discord-only, and Slack Socket Mode + Discord.
    upstream agent_health_private {
        server 127.0.0.1:3000;
        server 127.0.0.1:3001 backup;
        keepalive 4;
    }

    server {
        listen 443 ssl;
        server_name slack-agent.example.com;

        ssl_certificate C:/ProgramData/SlackEdge/tls/fullchain.pem;
        ssl_certificate_key C:/ProgramData/SlackEdge/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;

        location = /slack/events {
            if ($request_method != POST) { return 405; }

            limit_conn per_ip_connections 10;
            limit_conn global_connections 100;
            limit_req zone=per_ip_requests burst=10 nodelay;
            limit_req zone=global_requests burst=40 nodelay;

            # NGINX must read and bound the complete body before contacting Bolt.
            proxy_request_buffering on;
            proxy_pass http://slack_bolt_private;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 1s;
            proxy_send_timeout 3s;
            proxy_read_timeout 4s;
        }

        location = /discord/interactions {
            if ($request_method != POST) { return 405; }

            limit_conn per_ip_connections 10;
            limit_conn global_connections 100;
            limit_req zone=per_ip_requests burst=10 nodelay;
            limit_req zone=global_requests burst=40 nodelay;

            proxy_request_buffering on;
            proxy_pass http://discord_interactions_private;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 3s;
        }

        location = /healthz {
            if ($request_method != GET) { return 405; }

            limit_conn per_ip_connections 5;
            limit_conn global_connections 100;
            limit_req zone=per_ip_requests burst=5 nodelay;
            limit_req zone=global_requests burst=20 nodelay;

            proxy_pass http://agent_health_private;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }

        location / {
            return 404;
        }
    }
}
